[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-bridge"
version = "0.1.0"
description = "Scripts and utilities to connect the Agora to the internet."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "authlib>=1.3.0",
    "feedparser>=6.0.11",
    "flask>=3.1.2",
    "gunicorn>=21.2.0",
    "html2text>=2025.4.15",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "werkzeug>=3.1.3",
]

[project.optional-dependencies]
mastodon = [
    "mastodon-py==2.1.2",
]
twitter = [
    "tweepy>=4.10.1",
    "cachetools>=5.2.0",
]
bluesky = [
    "atproto==0.0.65",
]
matrix = [
    # Assuming maubot is the key dependency.
    # Further research might be needed if it's a more complex setup.
]
youtube = [
    "pytube>=15.0.0",
]
all = [
    "agora-bridge[mastodon]",
    "agora-bridge[twitter]",
    "agora-bridge[bluesky]",
    "agora-bridge[matrix]",
    "agora-bridge[youtube]",
]

[project.urls]
"Homepage" = "https://anagora.org/agora-bridge"
"Source" = "https://github.com/flancian/agora-bridge"

[tool.setuptools.packages.find]
include = ["bots*"]
